spring:
  application:
    name: studyflow-backend
  datasource:
    url: jdbc:h2:mem:studyflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt:
      issuer: studyflow-backend
      # Replace the development default with a base64-encoded secret in deployment.
      secret: ${STUDYFLOW_JWT_SECRET:c3R1ZHlmbG93LWRldmVsb3BtZW50LXNlY3JldC1tdXN0LWJlLWNoYW5nZWQ=}
      access-token-ttl: PT2H
