spring:
  datasource:
    url: ${STUDYFLOW_DB_URL:jdbc:mysql://localhost:3306/studyflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${STUDYFLOW_DB_USERNAME:root}
    password: ${STUDYFLOW_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
